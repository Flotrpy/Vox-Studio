    <rect x="0" y="3" width="4" height="4"/>
    <rect x="16" y="3" width="4" height="4"/>
    <rect x="4" y="7" width="4" height="4"/>
    <rect x="12" y="7" width="4" height="4"/>
    <rect x="8" y="11" width="4" height="4"/>
  </g>
  <rect x="26" y="3" width="1" height="12" fill="#5A5A5A"/>
  <text x="33" y="14" fill="#D2D2D2" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">VOX</text>
  <text x="68" y="14" fill="#9A9A9A" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="1.5">STUDIO</text>
