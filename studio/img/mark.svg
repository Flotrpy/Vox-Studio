<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 16" width="20" height="16">
  <!-- Vox mark: a V built from five voxels. Original design. -->
  <g fill="#D2D2D2">
    <rect x="0" y="2" width="4" height="4"/>
    <rect x="16" y="2" width="4" height="4"/>
    <rect x="4" y="6" width="4" height="4"/>
    <rect x="12" y="6" width="4" height="4"/>
    <rect x="8" y="10" width="4" height="4"/>
  </g>
</svg>
